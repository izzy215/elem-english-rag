    <rect x="970" y="230" width="96" height="40" rx="8" fill="#FBF0DC" stroke="#E8A33D"/><text x="1018" y="248" font-weight="700" fill="#B07514" text-anchor="middle">오답노트</text><text x="1018" y="262" fill="#5A3A08" text-anchor="middle" font-size="9">단어 + 문법 · 극복</text>

    <rect x="746" y="310" width="320" height="34" rx="8" fill="#F4F6F2" stroke="#DEE4DC"/><text x="906" y="331" fill="#69746C" text-anchor="middle">관리자: 데이터 상태 · RAG 정확도 · 소스 등록 경고</text>
