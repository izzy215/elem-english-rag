  <!-- ===== 정리 박스 ===== -->
  <rect x="40" y="604" width="500" height="160" rx="12" fill="#E4EFEA"/>
  <text x="60" y="630" font-size="12" font-weight="800" fill="#14554A">골든 데이터 확정 전에 정할 수 있는 것 (= 시스템 결정)</text>
  <text x="60" y="654" font-size="10.5" fill="#2C4A42">① 파일 형식 4개의 컬럼 — 내용은 나중에 채워도 됨</text>
  <text x="60" y="674" font-size="10.5" fill="#2C4A42">② 문제 유형을 "단어 고르기 + 문장 고치기" 2종으로 지원할지</text>
  <text x="60" y="694" font-size="10.5" fill="#2C4A42">③ 오답노트 저장 구조 (학생별 · 단어 칸 + 문법 칸) 와 화면 포함 여부</text>
  <text x="60" y="714" font-size="10.5" fill="#2C4A42">④ 극복 기준(연속 2회) · 오답 우선 출제 규칙</text>
  <text x="60" y="742" font-size="10" fill="#14554A" font-weight="700">→ 이 4개는 데이터가 rabbit이든 giraffe든 똑같이 적용되므로 지금 정해도 안전</text>

  <rect x="560" y="604" width="520" height="160" rx="12" fill="#FBF0DC"/>
  <text x="580" y="630" font-size="12" font-weight="800" fill="#B07514">골든 데이터 확정 후에 정할 것 (= 콘텐츠 결정)</text>
  <text x="580" y="654" font-size="10.5" fill="#5A3A08">· 어떤 교재 · 몇 학년 · Level ↔ 학년 매핑 · Unit 몇 개</text>
  <text x="580" y="674" font-size="10.5" fill="#5A3A08">· 문법 오류 문장을 1차 데모에 실제로 넣을지 (형식 지원은 미리, 사용은 데이터 보고)</text>
  <text x="580" y="694" font-size="10.5" fill="#5A3A08">· 평가셋 30문항의 실제 질문 · 청킹 전략 A/B/C 중 채택</text>
