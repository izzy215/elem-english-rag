    <rect x="950" y="496" width="130" height="44" rx="10" fill="#FBF0DC" stroke="#E8A33D"/><text x="1015" y="515" fill="#B07514" text-anchor="middle">오답노트</text><text x="1015" y="530" font-size="9" font-weight="500" fill="#5A3A08" text-anchor="middle">모아 보기 · 극복</text>
