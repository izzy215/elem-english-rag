  <text x="746" y="388" font-size="9.5" fill="#2C4A42">단어가 rabbit이든 giraffe든, 20개든 800개든 화면 코드는 동일</text>
  <text x="746" y="402" font-size="9.5" fill="#2C4A42">문장 고치기도 "문제 유형" 하나 — 보기 4개면 같은 화면</text>
  <text x="746" y="424" font-size="9.5" fill="#14554A" font-weight="700">지금 정할 것 ③  오답노트 화면 포함 · 문제 유형 2종</text>

