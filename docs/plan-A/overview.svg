<svg viewBox="0 0 1080 860" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#69746C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14554A"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A33D"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4553B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="860" fill="#F4F6F2"/>
  <text x="40" y="38" font-size="20" font-weight="800" fill="#1F2823">초등 영어학습 · RAG 맞춤 복습 — 1차 MVP 한눈에 보기</text>
  <text x="40" y="58" font-size="12" fill="#69746C">3주 · 개발 3인 · 핵심 루프: 학습 → 오답 기록 → RAG 교재 검색 → 그 학생 맞춤 문제·설명   (○ 1차 · 2026-09-04: 검수 경고·듣기·말하기 1차 승격)</text>

  <!-- ══════════ 1. 학생 화면 흐름 ══════════ -->
  <text x="40" y="92" font-size="12" font-weight="800" fill="#14554A">① 학생이 보는 화면 흐름 (화면 · 팀장)</text>

  <!-- Level -->
  <rect x="40" y="104" width="130" height="64" rx="10" fill="#FFFFFF" stroke="#DEE4DC"/>
  <text x="105" y="128" font-size="12.5" font-weight="700" fill="#1F2823" text-anchor="middle">Level 선택 ○</text>
  <text x="105" y="146" font-size="10" fill="#69746C" text-anchor="middle">1 · 2 · 3</text>
  <text x="105" y="160" font-size="9.5" fill="#69746C" text-anchor="middle">교재 학년에 맞춤</text>
  <line x1="170" y1="136" x2="196" y2="136" stroke="#69746C" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Unit -->
  <rect x="200" y="104" width="130" height="64" rx="10" fill="#FFFFFF" stroke="#DEE4DC"/>
  <text x="265" y="128" font-size="12.5" font-weight="700" fill="#1F2823" text-anchor="middle">Unit 선택 ○</text>
  <text x="265" y="146" font-size="10" fill="#69746C" text-anchor="middle">Unit 3 · Animals</text>
  <text x="265" y="160" font-size="9.5" fill="#69746C" text-anchor="middle">교재 목차 그대로</text>
  <line x1="330" y1="136" x2="356" y2="136" stroke="#69746C" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 학습 -->
  <rect x="360" y="104" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#DEE4DC"/>
  <text x="445" y="126" font-size="12.5" font-weight="700" fill="#1F2823" text-anchor="middle">단어 · 문장 학습 ○</text>
  <text x="445" y="144" font-size="10" fill="#69746C" text-anchor="middle">rabbit / 토끼 / The rabbit can jump.</text>
  <text x="445" y="160" font-size="9.5" fill="#14554A" text-anchor="middle">🔊 듣기 ○ · 🎙 따라 말하기 ○ (유사도 점수)</text>
  <line x1="530" y1="136" x2="556" y2="136" stroke="#69746C" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 문제 -->
  <rect x="560" y="104" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#14554A" stroke-width="2"/>
  <text x="635" y="126" font-size="12.5" font-weight="700" fill="#1F2823" text-anchor="middle">AI 문제 풀기 ○</text>
  <text x="635" y="144" font-size="10" fill="#69746C" text-anchor="middle">3~5문제 · 객관식/빈칸</text>
  <text x="635" y="160" font-size="9.5" fill="#14554A" text-anchor="middle">학생마다 다른 문제</text>
  <line x1="710" y1="136" x2="736" y2="136" stroke="#C4553B" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="723" y="126" font-size="9" fill="#C4553B" text-anchor="middle">틀림</text>

  <!-- 오답설명 -->
  <rect x="740" y="104" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#14554A" stroke-width="2"/>
  <text x="815" y="126" font-size="12.5" font-weight="700" fill="#1F2823" text-anchor="middle">오답 설명 ○</text>
  <text x="815" y="144" font-size="10" fill="#69746C" text-anchor="middle">"rabbit은 토끼예요"</text>
  <text x="815" y="160" font-size="9.5" fill="#14554A" text-anchor="middle">+ 교재 12쪽 근거 표시</text>

  <!-- 말하기 2차 -->
  <rect x="910" y="104" width="130" height="64" rx="10" fill="#FFFFFF" stroke="#DEE4DC"/>
  <text x="975" y="130" font-size="12" font-weight="700" fill="#1F2823" text-anchor="middle">말하기 평가 ○</text>
  <text x="975" y="150" font-size="10" fill="#69746C" text-anchor="middle">STT → 원문 유사도 점수</text>

  <!-- 루프 화살표: 오답설명 → 다시 문제 -->
  <path d="M 815 168 C 815 200, 640 200, 636 172" fill="none" stroke="#E8A33D" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="726" y="197" font-size="10" font-weight="700" fill="#B07514" text-anchor="middle">틀린 단어가 다음 문제에 우선 출제 ← "맞춤"의 증거</text>

  <!-- ══════════ 2. 서버 · AI ══════════ -->
  <text x="40" y="240" font-size="12" font-weight="800" fill="#14554A">② 뒤에서 도는 것 (FastAPI · server.py)</text>

  <rect x="40" y="252" width="1000" height="150" rx="12" fill="#14554A"/>
  <text x="60" y="278" font-size="14" font-weight="800" fill="#FFFFFF">FastAPI 서버 — 화면은 API만 부른다</text>

  <!-- RAG -->
  <rect x="60" y="292" width="300" height="96" rx="10" fill="#FFFFFF"/>
  <rect x="72" y="302" width="26" height="18" rx="9" fill="#14554A"/><text x="85" y="315" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">A</text>
  <text x="104" y="316" font-size="12.5" font-weight="800" fill="#1F2823">RAG 검색 ○ — 가장 큰 작업</text>
  <text x="348" y="316" font-size="9.5" font-weight="700" fill="#69746C" text-anchor="end">RAG 담당</text>
  <text x="72" y="337" font-size="10" fill="#2C4A42">질문/오답 단어 → 04_rag_chunks에서 관련 교재 조각 검색</text>
  <text x="72" y="352" font-size="10" fill="#2C4A42">임베딩 + 벡터 검색(FAISS) · 청킹 전략 비교</text>
  <text x="72" y="367" font-size="10" fill="#2C4A42">GET /api/rag/search?q=rabbit</text>
  <text x="72" y="382" font-size="10" font-weight="700" fill="#14554A">평가셋 30문항으로 정확도 측정 → 발표 숫자</text>

  <!-- 문제생성 -->
  <rect x="376" y="292" width="300" height="96" rx="10" fill="#FFFFFF"/>
  <rect x="388" y="302" width="26" height="18" rx="9" fill="#14554A"/><text x="401" y="315" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">B</text>
  <text x="420" y="316" font-size="12.5" font-weight="800" fill="#1F2823">AI 문제생성 ○ + 오답 반영</text>
  <text x="664" y="316" font-size="9.5" font-weight="700" fill="#69746C" text-anchor="end">팀장 (AI API)</text>
  <text x="388" y="337" font-size="10" fill="#2C4A42">입력: Unit 단어 + RAG 조각 + 이 학생의 최근 오답</text>
  <text x="388" y="352" font-size="10" fill="#2C4A42">Gemini → 객관식/빈칸 문제 JSON</text>
  <text x="388" y="367" font-size="10" fill="#2C4A42">POST /api/quiz {unit, student}</text>
  <text x="388" y="382" font-size="10" font-weight="700" fill="#B07514">프롬프트 한 줄: "최근 틀린 단어를 우선 포함"</text>

  <!-- 오답설명 -->
  <rect x="692" y="292" width="200" height="96" rx="10" fill="#FFFFFF"/>
  <rect x="704" y="302" width="26" height="18" rx="9" fill="#14554A"/><text x="717" y="315" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">C</text>
  <text x="736" y="316" font-size="12.5" font-weight="800" fill="#1F2823">오답 설명 ○</text>
  <text x="880" y="316" font-size="9.5" font-weight="700" fill="#69746C" text-anchor="end">팀장</text>
  <text x="704" y="337" font-size="10" fill="#2C4A42">틀린 문제 + RAG 조각 →</text>
  <text x="704" y="352" font-size="10" fill="#2C4A42">초등 눈높이 설명 + 출처</text>
  <text x="704" y="367" font-size="10" fill="#2C4A42">POST /api/explain</text>
  <text x="704" y="382" font-size="10" font-weight="700" fill="#14554A">오답 로그에 기록 → B로</text>

  <!-- TTS -->
  <rect x="908" y="292" width="116" height="96" rx="10" fill="#FFFFFF"/>
  <text x="966" y="316" font-size="12" font-weight="800" fill="#1F2823" text-anchor="middle">TTS · STT ○</text><text x="966" y="302" font-size="8.5" font-weight="700" fill="#69746C" text-anchor="middle">TTS 담당</text>
  <text x="966" y="337" font-size="9.5" fill="#69746C" text-anchor="middle">TTS: sample 이식</text>
  <text x="966" y="352" font-size="9.5" fill="#69746C" text-anchor="middle">/api/tts · /api/speak</text>
  <text x="966" y="367" font-size="9.5" fill="#69746C" text-anchor="middle">STT: 유사도 채점만</text>

  <!-- 화면 → 서버 -->
  <line x1="635" y1="168" x2="526" y2="290" stroke="#14554A" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrG)"/>
  <line x1="815" y1="168" x2="792" y2="290" stroke="#14554A" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrG)"/>
  <!-- A → B, C -->
  <line x1="360" y1="340" x2="376" y2="340" stroke="#14554A" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="676" y1="340" x2="692" y2="340" stroke="#14554A" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- ══════════ 3. 데이터 ══════════ -->
  <text x="40" y="430" font-size="12" font-weight="800" fill="#14554A">③ 데이터 — 코드보다 먼저 준비해야 하는 것 (첫 주 병목)</text>

  <!-- 교재 파이프라인 -->
  <rect x="40" y="442" width="700" height="150" rx="12" fill="#FFFFFF" stroke="#DEE4DC"/>
  <text x="60" y="466" font-size="12.5" font-weight="800" fill="#1F2823">교재 데이터 파이프라인 (카톡 그림 그대로)</text>
  <text x="720" y="466" font-size="9.5" font-weight="700" fill="#69746C" text-anchor="end">데이터팀 제작 · 인터페이스 협의는 RAG 담당</text>

  <g font-size="9.5" text-anchor="middle">
    <rect x="60"  y="480" width="100" height="56" rx="8" fill="#F4F6F2" stroke="#DEE4DC"/>
    <text x="110" y="500" font-weight="800" fill="#1F2823">00_original</text>
    <text x="110" y="515" fill="#69746C">교재 PDF 원본</text>
    <text x="110" y="528" fill="#C4553B" font-weight="700">← 아직 없음!</text>

    <rect x="172" y="480" width="100" height="56" rx="8" fill="#F4F6F2" stroke="#DEE4DC"/>
    <text x="222" y="500" font-weight="800" fill="#1F2823">01_extracted</text>
    <text x="222" y="515" fill="#69746C">텍스트 추출</text>
    <text x="222" y="528" fill="#69746C">raw.md / csv</text>

    <rect x="284" y="480" width="100" height="56" rx="8" fill="#FBF0DC" stroke="#E8A33D"/>
    <text x="334" y="500" font-weight="800" fill="#1F2823">02_golden</text>
    <text x="334" y="515" fill="#69746C">사람이 검수한</text>
    <text x="334" y="528" fill="#69746C">단어·문장·뜻</text>

    <rect x="396" y="480" width="100" height="56" rx="8" fill="#F4F6F2" stroke="#DEE4DC"/>
    <text x="446" y="500" font-weight="800" fill="#1F2823">03_enriched</text>
    <text x="446" y="515" fill="#69746C">예문·난이도·설명</text>
    <text x="446" y="528" fill="#69746C">Gemini로 보강</text>

    <rect x="508" y="480" width="100" height="56" rx="8" fill="#E4EFEA" stroke="#14554A" stroke-width="2"/>
    <text x="558" y="500" font-weight="800" fill="#14554A">04_rag_chunks</text>
    <text x="558" y="515" fill="#2C4A42">서비스가 검색</text>
    <text x="558" y="528" fill="#2C4A42">벡터 DB 입력</text>

    <rect x="620" y="480" width="100" height="56" rx="8" fill="#F4F6F2" stroke="#DEE4DC"/>
    <text x="670" y="500" font-weight="800" fill="#1F2823">05_evaluation</text>
    <text x="670" y="515" fill="#69746C">질문·정답 30개</text>
    <text x="670" y="528" fill="#69746C">정확도 측정용</text>
  </g>
  <g stroke="#69746C" stroke-width="1.3" marker-end="url(#arr)">
    <line x1="160" y1="508" x2="170" y2="508"/><line x1="272" y1="508" x2="282" y2="508"/>
    <line x1="384" y1="508" x2="394" y2="508"/><line x1="496" y1="508" x2="506" y2="508"/>
    <line x1="608" y1="508" x2="618" y2="508"/>
  </g>
  <text x="60" y="560" font-size="10" fill="#2C4A42">Level·Unit 메뉴와 단어·문장 학습 화면은 <tspan font-weight="700">02_golden</tspan>을 그대로 보여주는 것 → 02가 없으면 화면도 없음</text>
  <text x="60" y="578" font-size="10" fill="#2C4A42">A(RAG)는 04를 검색 · B·C는 검색 결과를 Gemini에 넣음 · 05는 A의 성적표</text>

  <!-- 학생 DB -->
  <rect x="760" y="442" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#DEE4DC"/>
  <text x="780" y="466" font-size="12.5" font-weight="800" fill="#1F2823">학생 DB (JSON → BigQuery)</text>
  <text x="780" y="490" font-size="10" fill="#2C4A42">student_id · level · unit · 진도</text>
  <text x="780" y="508" font-size="10" fill="#2C4A42">quiz_log: 문제 · 정답 여부 · 시각</text>
  <text x="780" y="526" font-size="10" font-weight="700" fill="#B07514">wrong_words: 학생별 오답 단어 누적</text>
  <text x="780" y="550" font-size="10" fill="#69746C">로그인 없음 → 이름 선택 드롭다운으로 대체</text>
  <text x="780" y="568" font-size="10" fill="#69746C">(학생 A / 학생 B 두 명이면 데모 충분)</text>
  <!-- 04 → A, 학생DB → B -->
  <path d="M 558 480 C 558 440, 300 420, 210 390" fill="none" stroke="#14554A" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrG)"/>
  <path d="M 900 442 C 900 420, 560 420, 526 390" fill="none" stroke="#E8A33D" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrA)"/>

  <!-- ══════════ 4. 뺀 것 / 데모 / 일정 ══════════ -->
  <rect x="40" y="612" width="330" height="140" rx="12" fill="#F7E4DE"/>
  <text x="60" y="638" font-size="12" font-weight="800" fill="#C4553B">이번엔 안 만드는 것</text>
  <text x="60" y="660" font-size="10.5" fill="#5A2E24">로그인 · 회원가입 → 이름 드롭다운</text>
  <text x="60" y="678" font-size="10.5" fill="#5A2E24">개인별 복습 화면 → B의 프롬프트로 흡수</text>
  <text x="60" y="696" font-size="10.5" fill="#5A2E24">스토리 생성 · XP · 배지 · 랭킹</text>
  <text x="60" y="714" font-size="10.5" fill="#5A2E24">음소 단위 발음 채점 (말하기는 유사도까지만)</text>
  <text x="60" y="738" font-size="10" fill="#8A4A3C">→ 발표 때 "2차 로드맵"으로 한 장</text>

  <rect x="386" y="612" width="354" height="140" rx="12" fill="#E4EFEA"/>
  <text x="406" y="638" font-size="12" font-weight="800" fill="#14554A">60초 데모</text>
  <text x="406" y="660" font-size="10.5" fill="#2C4A42">① Level 2 → Unit 3 선택 → 단어 5개 (듣기)</text>
  <text x="406" y="678" font-size="10.5" fill="#2C4A42">② AI 문제 3개 풀기 → rabbit 틀림</text>
  <text x="406" y="696" font-size="10.5" fill="#2C4A42">③ 오답 설명 + "교재 12쪽" 근거 표시</text>
  <text x="406" y="714" font-size="10.5" font-weight="700" fill="#14554A">④ 다시 풀기 → rabbit이 먼저 나옴 (학생 B는 다름)</text>
  <text x="406" y="738" font-size="10.5" fill="#2C4A42">⑤ 검색 정확도 그래프: 62% → 84%</text>

  <rect x="756" y="612" width="284" height="140" rx="12" fill="#FFFFFF" stroke="#DEE4DC"/>
  <text x="776" y="638" font-size="12" font-weight="800" fill="#1F2823">3주 일정</text>
  <text x="776" y="660" font-size="10.5" fill="#2C4A42"><tspan font-weight="700">1주</tspan> PRD 확정 · 교재 확보 · 02_golden 1개 Unit</text>
  <text x="776" y="678" font-size="10.5" fill="#2C4A42">     Level/Unit/학습 화면 · 평가셋 초안</text>
  <text x="776" y="696" font-size="10.5" fill="#2C4A42"><tspan font-weight="700">2주</tspan> RAG 검색 · 문제생성 · 오답설명 · TTS · 검수 경고</text>
  <text x="776" y="714" font-size="10.5" fill="#2C4A42">     정확도 1차 측정 → 청킹 개선</text>
  <text x="776" y="732" font-size="10.5" fill="#2C4A42"><tspan font-weight="700">3주</tspan> 말하기(STT) · 오답 반영 · 통합 · 동결 · 발표</text>

  <!-- footer -->
  <text x="40" y="784" font-size="10.5" font-weight="700" fill="#14554A">범례</text>
  <text x="80" y="784" font-size="10.5" fill="#69746C">굵은 테두리 = RAG 핵심 · 주황 점선 = 오답 로그 흐름 · 초록 점선 = 교재 데이터 흐름</text>
  <text x="40" y="806" font-size="10.5" fill="#69746C">지금 있는 것 재사용: FastAPI 서버 뼈대 · .env/config · TTS 캐시 · 승인 워크플로우(02_golden 검수에 재활용) · 이벤트 로그(오답 로그로 확장)</text>
  <text x="40" y="828" font-size="10.5" font-weight="700" fill="#C4553B">PRD 전에 정할 것: ① 교재를 무엇으로 할지 (00_original) ② 초등 몇 학년 ③ 문제 유형 (객관식/빈칸/둘 다)</text>
</svg>
