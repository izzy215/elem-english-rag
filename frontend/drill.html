<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등 영어 · 규칙 연습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main>
    <h1 id="drillTitle">규칙 연습</h1>
    <p class="sub">밑줄 친 곳을 어떻게 고칠까요? <span id="drillPage"></span></p>
    <div class="q"><div class="sent" id="drillSent"></div><div class="choices" id="drillChoices"></div><div class="result" id="drillResult"></div></div>
    <div class="src" id="drillSrc" style="display:none"></div>
    <button class="btn" id="drillNext" onclick="next()" disabled>다음</button>
    <button class="btn ghost" onclick="go('notebook.html')">오답노트로</button>
    <p class="hint" id="drillHint"></p>
  </main>
  <div class="status" id="status"></div>
</div>
<script src="js/common.js"></script>
<script src="js/drill.js"></script>
</body>
</html>
