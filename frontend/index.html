<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등 영어 · 시작</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main>
    <!-- 4.1 시작 -->
    <h1>안녕! 오늘도 영어 연습하자 👋</h1>
    <p class="sub">이름을 고르고 Level을 선택하세요</p>

    <label class="field" for="studentSel">학생</label>
    <select id="studentSel" onchange="setStudent(this.value)">
      <option value="A">학생 A</option>
      <option value="B">학생 B</option>
    </select>

    <label class="field">Level</label>
    <div class="cards" id="levelCards"><div class="empty">불러오는 중…</div></div>
    <p class="hint">Level 1 = 3~4학년 · Level 2 = 5학년 · Level 3 = 6학년 (기본값, 데이터팀 납품 시 확정)</p>
  </main>
  <div class="status" id="status"></div>
</div>
<script src="js/common.js"></script>
<script src="js/start.js"></script>
</body>
</html>
