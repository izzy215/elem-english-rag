<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등 영어 · 미션 성공</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="flow" id="flow"></div>
    <!-- 유닛 흐름 마지막 화면 (목업 9/15): 오늘 한 것 숫자 + 다음 유닛 / 한 번 더 / 홈 -->
    <div class="done-card">
      <div class="head"><div class="ic">🎉</div><div><h2 id="doneTitle">미션 성공!</h2><div class="sub" id="doneSub"></div></div></div>
      <div class="stats"><div><b id="nPat">0</b><span>익힌 표현</span></div><div><b id="nSent">0</b><span>말한 문장</span></div><div><b id="nRule">0</b><span>고친 규칙</span></div></div>
      <button class="btn next" id="nextBtn" onclick="goNext()">다음 유닛으로 →<span class="sub" id="nextSub">불러오는 중…</span></button>
      <div class="links"><button onclick="again()">이 유닛 한 번 더</button><span>·</span><button onclick="go('index.html')">홈으로</button></div>
    </div>
    <div class="done-list" id="doneList"></div>
    <p class="hint" id="nbHint" style="display:none">고친 문장은 <b>오답노트</b>에 들어갔어요. 다음에 다시 연습할 수 있어요. <button class="chip" onclick="go('notebook.html')" style="margin-left:4px">오답노트 보기</button></p>
  </main>
  <div class="status" id="status"></div>
</div>
<script src="js/common.js"></script>
<script src="js/success.js"></script>
</body>
</html>
