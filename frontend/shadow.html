<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등 영어 · 따라 말하기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main>
    <h1>따라 말하기</h1>
    <p class="sub">패턴 문장을 듣고 똑같이 말해봐요 · 얼마나 비슷하게 들렸는지 점수로</p>
    <div class="flash" style="margin-top:10px"><div class="word" id="shTarget">…</div><div class="mean" id="shMean"></div></div>
    <div class="dots" id="shDots"></div>
    <div class="tools"><button class="tool" id="shTts" onclick="playTarget()">🔊 듣기</button><button class="tool" id="shRec" onclick="record()">🎙 따라 말하기</button></div>
    <div class="diag" id="shWave" style="display:none;padding:12px 10px 8px">
      <div class="wave-lbl"><span>🔊 선생님</span><span id="wvTTxt"></span></div><div class="wave teacher" id="wvT"></div>
      <div class="wave-lbl"><span>🎙 나</span><span id="wvMTxt"></span></div><div class="wave me" id="wvM"></div>
    </div>
    <div class="heard" id="shHeard" style="display:none"><div class="lbl">들린 문장 (STT)</div><div class="s" id="shHeardS"></div></div>
    <div class="diag" id="shResult" style="display:none"></div>
    <div class="likeness" id="shLike" style="display:none"><div class="lbl">선생님 목소리와 닮은 정도</div><div class="lv" id="shLv"></div><div class="msg" id="shLikeMsg"></div></div>
    <div class="result" id="shNote"></div>
    <div class="row2"><button class="btn ghost" onclick="move(1)">다음 문장</button><button class="btn" onclick="go('tutor.html')">이제 내 문장 말하기 →</button></div>
    <p class="hint">점수 = 들린 문장과 원문의 단어 일치율(70 통과). 발음 자체를 채점하는 게 아니라 "제대로 들렸나"예요. 닮은 정도는 참고용.</p>
  </main>
  <div class="status" id="status"></div>
  <audio id="player"></audio>
</div>
<script src="js/common.js"></script>
<script src="js/shadow.js"></script>
</body>
</html>
