<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등 영어 · 표현 익히기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main>
    <h1>표현 익히기</h1>
    <p class="sub">오늘 쓸 단어와 문장 패턴을 먼저 봐요 · 탭하면 들려요</p>
    <label class="field">단어 <span id="wordCnt" style="font-weight:500"></span></label>
    <div class="mini-row" id="wordRow"></div>
    <label class="field">문장 패턴 <span id="patPage" style="font-weight:500"></span></label>
    <div class="flash" id="patCard"><div class="word">불러오는 중…</div></div>
    <div class="dots" id="patDots"></div>
    <div class="tools"><button class="tool" id="patTts" onclick="playPattern()">🔊 듣기</button><button class="tool" onclick="go('shadow.html')">🎙 따라 말하기</button></div>
    <div class="result" id="learnResult"></div>
    <div class="row2"><button class="btn ghost" onclick="movePat(-1)">이전</button><button class="btn ghost" onclick="movePat(1)">다음 패턴</button></div>
    <button class="btn" onclick="go('tutor.html')">이 표현으로 말해보기 🎙</button>
    <p class="hint">단어·패턴은 참고용이에요. 바로 말해보기로 가도 돼요.</p>
  </main>
  <div class="status" id="status"></div>
  <audio id="player"></audio>
</div>
<script src="js/common.js"></script>
<script src="js/learn.js"></script>
</body>
</html>
